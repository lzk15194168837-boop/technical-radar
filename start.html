function filter(){const q=$('search').value.toLowerCase(),k=$('kind').value;rows=ALL.filter(e=>(k==='全部'||e.displayKind===k)&&[e.title,e.summary].join(' ').toLowerCase().includes(q));index=0;render()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('search').oninput=filter;$('kind').onchange=filter;$('close').onclick=()=>$('dialog').close();
$('directory').onclick=()=>{show('卡片目录','<div class=tiles>'+rows.map((e,i)=>'<button data-index='+i+'>'+esc(e.cardType)+'<br>'+esc(e.cardTitle)+'</button>').join('')+'</div>');$('dialogBody').querySelectorAll('button').forEach(b=>b.onclick=()=>{index=Number(b.dataset.index);render();$('dialog').close()})};
$('about').onclick=()=>show('技术雷达是什么','<p>帮助个人收集技术信息、核对来源、判断用途，并长期保存为容易理解的知识卡。</p><p>四方面分别看能力、可靠、适用、搭配，不用一个总分概括。</p><p>当前仅演示界面交互；没有接通研究、真实云端或手机到电脑运输。全部样例和分数为虚构。</p>');
document.onkeydown=e=>{if($('dialog').open||document.activeElement.tagName==='INPUT')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)};render();
</script></html>
